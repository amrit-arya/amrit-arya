name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: amrit-arya
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300C853&color_dots=%230D1117,%231B5E20,%232E7D32,%2343A047,%2300C853
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300C853

      - name: Publish Snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
